name: "Skill eval coverage"

on:
  pull_request:
    branches:
      - main
    paths:
      - "skills-src/**"
      - "docs/docs/**"
      - "scripts/skill-resolver.js"
      - "scripts/skill-check.js"
      - "scripts/skill-coverage.js"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  coverage:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      # Pure Node + repo sources — no dependency install needed.
      - name: Check skill eval-stamp coverage
        run: node scripts/skill-coverage.js
